[build]
  publish = "."

[[headers]]
  for = "/deals.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/deals.csv"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/csv; charset=utf-8"
